<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1540" viewBox="0 0 1000 1540"><style>.t{font-family:'Noto Sans Devanagari','Arial',sans-serif;fill:#1f2328}.h{font-size:44px;font-weight:700}.sub{font-size:23px;fill:#57606a}.step{font-size:28px;font-weight:700}.txt{font-size:22px}.mono{font-family:Consolas,monospace;font-size:21px}.num{font-size:24px;font-weight:700;fill:#fff}.btn{font-size:20px;font-weight:700;fill:#fff}</style><rect width="1000" height="1540" fill="#f6f8fa"/><text x="55" y="75" class="t h">GitHub upload के बाद</text><text x="58" y="119" class="t sub">अब ऐप को Render पर चलाएँ</text>
<rect x="45" y="155" width="910" height="195" rx="22" fill="#fff" stroke="#d0d7de" stroke-width="2"/><circle cx="96" cy="210" r="28" fill="#24292f"/><text x="96" y="218" text-anchor="middle" class="num">1</text><text x="145" y="219" class="t step">पहले GitHub में बदलाव सेव करें</text><text x="85" y="272" class="t txt">फ़ाइलें अभी upload page पर हों तो नीचे जाकर</text><text x="85" y="310" class="t txt" font-weight="700">Commit changes</text><text x="284" y="310" class="t txt">दबाएँ। अगर repository में फ़ाइलें दिख रही हैं, आगे जाएँ।</text>
<rect x="45" y="375" width="910" height="225" rx="22" fill="#fff" stroke="#d0d7de" stroke-width="2"/><circle cx="96" cy="430" r="28" fill="#24292f"/><text x="96" y="438" text-anchor="middle" class="num">2</text><text x="145" y="439" class="t step">Render खोलें</text><text x="85" y="495" class="t txt">dashboard.render.com पर जाएँ और GitHub से sign in करें।</text><text x="85" y="544" class="t txt">फिर <tspan font-weight="700">New → Web Service</tspan> चुनें।</text>
<rect x="45" y="625" width="910" height="235" rx="22" fill="#fff" stroke="#d0d7de" stroke-width="2"/><circle cx="96" cy="680" r="28" fill="#24292f"/><text x="96" y="688" text-anchor="middle" class="num">3</text><text x="145" y="689" class="t step">अपनी GitHub repository जोड़ें</text><text x="85" y="745" class="t txt">GitHub access माँगे तो अनुमति दें, फिर चुनें:</text><rect x="85" y="780" width="450" height="52" rx="9" fill="#eef6ff" stroke="#0969da" stroke-width="2"/><text x="105" y="814" class="t mono">do-private-text-room</text>
<rect x="45" y="885" width="910" height="360" rx="22" fill="#fff" stroke="#d0d7de" stroke-width="2"/><circle cx="96" cy="940" r="28" fill="#24292f"/><text x="96" y="948" text-anchor="middle" class="num">4</text><text x="145" y="949" class="t step">सेटिंग भरें</text><text x="85" y="1005" class="t txt">Language</text><text x="380" y="1005" class="t mono">Node</text><line x1="85" y1="1022" x2="900" y2="1022" stroke="#d8dee4"/><text x="85" y="1065" class="t txt">Build Command</text><text x="380" y="1065" class="t mono">npm install</text><line x1="85" y1="1082" x2="900" y2="1082" stroke="#d8dee4"/><text x="85" y="1125" class="t txt">Start Command</text><text x="380" y="1125" class="t mono">npm start</text><line x1="85" y1="1142" x2="900" y2="1142" stroke="#d8dee4"/><text x="85" y="1185" class="t txt">Plan</text><text x="380" y="1185" class="t mono">Free</text>
<rect x="45" y="1270" width="910" height="210" rx="22" fill="#fff" stroke="#d0d7de" stroke-width="2"/><circle cx="96" cy="1325" r="28" fill="#24292f"/><text x="96" y="1333" text-anchor="middle" class="num">5</text><text x="145" y="1334" class="t step">Deploy दबाएँ</text><text x="85" y="1390" class="t txt">Live होने पर Render एक https://…onrender.com लिंक देगा।</text><text x="85" y="1432" class="t txt">वही लिंक दूसरे व्यक्ति को भेजें।</text><text x="58" y="1510" class="t sub">Render पर Web Service चुनें — Static Site नहीं।</text></svg>